name: Windows build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build application
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Build Windows binary
        shell: pwsh
        run: $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'; go build -trimpath -ldflags '-s -w' -o Anno117PipeHub.exe .

      - name: Check dashboard JavaScript
        shell: pwsh
        run: node --check src/AnnoPipeHub/wwwroot/app.js

      - name: Test dashboard translations
        shell: pwsh
        run: node tests/debug-translations.test.js