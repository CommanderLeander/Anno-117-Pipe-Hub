name: Windows build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build application
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Build Windows binary
        shell: pwsh
        run: $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'; go build -trimpath -ldflags '-s -w' -o Anno117PipeHub.exe .

      - name: Check dashboard JavaScript
        shell: pwsh
        run: node --check src/AnnoPipeHub/wwwroot/app.js

      - name: Test dashboard translations
        shell: pwsh
        run: node tests/debug-translations.test.js

  release-malware-scan:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build Windows release package
        shell: pwsh
        run: .\Publish-Windows.ps1

      - name: Install ClamAV
        shell: pwsh
        run: choco install clamav -y --no-progress

      - name: Update ClamAV signatures
        shell: pwsh
        run: |
          $clamAvDirectory = Join-Path ${env:ProgramFiles} 'ClamAV'
          $env:Path = "$clamAvDirectory;$env:Path"
          $freshclam = Join-Path $clamAvDirectory 'freshclam.exe'
          if (-not (Test-Path $freshclam -PathType Leaf)) {
            throw "freshclam.exe was not found at $freshclam"
          }
          & $freshclam --stdout --verbose
          if ($LASTEXITCODE -ne 0) {
            throw "ClamAV signature update failed with exit code $LASTEXITCODE"
          }

      - name: Scan release ZIP and extracted EXE
        shell: pwsh
        run: |
          $clamAvDirectory = Join-Path ${env:ProgramFiles} 'ClamAV'
          $env:Path = "$clamAvDirectory;$env:Path"
          $clamscan = Join-Path $clamAvDirectory 'clamscan.exe'
          $sigtool = Join-Path $clamAvDirectory 'sigtool.exe'
          $zipPath = Join-Path $PWD 'publish\Anno117PipeHub-windows-x64.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'Anno117PipeHub-scan'
          if (-not (Test-Path $clamscan -PathType Leaf)) {
            throw "clamscan.exe was not found at $clamscan"
          }
          if (-not (Test-Path $zipPath -PathType Leaf)) {
            throw "Release ZIP was not found at $zipPath"
          }
          if (Test-Path $extractPath) { Remove-Item $extractPath -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath
          $exePath = Join-Path $extractPath 'Anno117PipeHub.exe'
          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Extracted release EXE was not found at $exePath"
          }

          & $clamscan --no-summary --infected $zipPath
          $zipExitCode = $LASTEXITCODE
          if ($zipExitCode -ne 0) {
            throw "ClamAV ZIP scan failed or detected malware with exit code $zipExitCode"
          }
          & $clamscan --no-summary --infected $exePath
          $exeExitCode = $LASTEXITCODE
          if ($exeExitCode -ne 0) {
            throw "ClamAV EXE scan failed or detected malware with exit code $exeExitCode"
          }

          $signatureFiles = Get-ChildItem -Path @(
            (Join-Path ${env:ProgramData} 'ClamAV'),
            $clamAvDirectory
          ) -Include '*.cvd', '*.cld' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Unique
          if (-not $signatureFiles) {
            throw 'No ClamAV signature database files were found after the update'
          }
          $signatureStand = $signatureFiles | ForEach-Object {
            $info = if (Test-Path $sigtool -PathType Leaf) { & $sigtool --info $_.FullName 2>&1 } else { @() }
            $version = ($info | Select-String '^Version:' | Select-Object -First 1).Line
            if ([string]::IsNullOrWhiteSpace($version)) { $version = 'version=unavailable' }
            "$($_.Name) $version updated=$($_.LastWriteTimeUtc.ToString('o'))"
          }
          @"
          ### Windows release malware scan

          - Paket: `Anno117PipeHub-windows-x64.zip`
          - Scanner: `ClamAV $(& $clamscan --version)`
          - Signaturstand: $($signatureStand -join '; ')
          - Ergebnis: **keine Erkennung**
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
